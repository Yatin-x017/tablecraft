<script>
        function selectPartySize(btn, value) {
            // Reset all buttons
            document.querySelectorAll('.party-btn').forEach(b => {
                b.classList.remove('bg-primary-container', 'text-on-primary-container');
                b.classList.add('bg-white');
            });
            
            // Highlight selected
            btn.classList.remove('bg-white');
            btn.classList.add('bg-primary-container', 'text-on-primary-container');
            
            // Update summary
            document.getElementById('summary-details').innerHTML = `Reserving for <span class="text-primary font-bold">${value}</span> Guests on <span class="text-primary font-bold">Jun 4</span>`;
            
            // Feedback
            btn.classList.add('scale-90');
            setTimeout(() => btn.classList.remove('scale-90'), 150);
        }

        // Lightweight interactive hover for buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => button.classList.add('active:scale-95'));
        });
    </script>
