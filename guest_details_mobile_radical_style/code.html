<body class="bg-background-cream text-on-background font-body-md min-h-screen relative overflow-x-hidden">
<!-- Sprinkle Background Overlay -->

<!-- Top Navigation Anchor -->

<button class="w-10 h-10 flex items-center justify-center hover:scale-105 transition-transform">

</button>
<h1 class="font-headline-md text-headline-md text-primary">Reserve a Treat</h1>
<button class="w-10 h-10 flex items-center justify-center hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-primary" data-icon="close">close</span>
</button>
</header>
<main class="pt-20 pb-32 px-margin-mobile max-w-md mx-auto relative z-10">
<!-- Step Indicator -->
<div class="mb-8">
<div class="flex justify-between items-end mb-2">

<div class="h-4 w-full bg-surface-container rounded-full border-2 border-on-background p-0.5 overflow-hidden">

</div>
</div>
<!-- Reservation Summary Card -->
<section class="bg-surface-white border-2 border-on-background rounded-xl p-5 mb-8 offset-shadow relative overflow-hidden">
<div class="absolute -top-4 -right-4 w-12 h-12 bg-secondary-container border-2 border-on-background rounded-full flex items-center justify-center rotate-12">
<span class="material-symbols-outlined text-on-background" data-icon="auto_awesome">auto_awesome</span>
</div>
<div class="flex justify-between items-start mb-4">
<h2 class="font-headline-md text-headline-md">Your Selection</h2>
<button class="text-primary font-label-bold underline decoration-2 underline-offset-4 hover:text-tertiary transition-colors">Edit</button>
</div>
<div class="space-y-3">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="calendar_today">calendar_today</span>

</div>
<div class="flex items-center gap-3">

</div>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="group">group</span>

<!-- Form Section -->
<form class="space-y-6">
<div>

</button>

</div>

<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('input, textarea').forEach(el => {
            el.addEventListener('focus', () => {
                // Playful wiggle on focus
                el.parentElement.classList.add('animate-pulse');
                setTimeout(() => el.parentElement.classList.remove('animate-pulse'), 500);
            });
        });

        const confirmBtn = document.querySelector('button.bg-primary-container');
        confirmBtn.addEventListener('click', function(e) {
            // Confetti effect placeholder logic
            const colors = ['#ae3115', '#ff6b4a', '#fdc73a', '#bc054a'];
            for(let i = 0; i < 20; i++) {
                createConfetti(e.clientX, e.clientY, colors[Math.floor(Math.random() * colors.length)]);
            }
        });

        function createConfetti(x, y, color) {
            const confetti = document.createElement('div');
            confetti.style.position = 'fixed';
            confetti.style.left = x + 'px';
            confetti.style.top = y + 'px';
            confetti.style.width = '8px';
            confetti.style.height = '8px';
            confetti.style.backgroundColor = color;
            confetti.style.borderRadius = '50%';
            confetti.style.pointerEvents = 'none';
            confetti.style.zIndex = '100';
            document.body.appendChild(confetti);

            const destX = (Math.random() - 0.5) * 200;
            const destY = (Math.random() - 0.5) * 200 - 100;

            confetti.animate([
                { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                { transform: `translate(${destX}px, ${destY}px) scale(0)`, opacity: 0 }
            ], {
                duration: 800 + Math.random() * 400,
                easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)',
                fill: 'forwards'
            }).onfinish = () => confetti.remove();
        }
    </script>
